name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: terminal_test
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: terminal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terminal_test -d terminal_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://terminal_test:ci-only-disposable@127.0.0.1:5432/terminal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest tests -q --tb=short
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python -m uvicorn app.api:app --host 127.0.0.1 --port 8790 > /tmp/terminal-api.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8790/api/ready && break; sleep 1; done
          cd frontend && node scripts/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: .local/release-browser/
